<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 - 励洋辅助站</title>
<link rel="icon" href="/favicon/favicon.ico">
<link rel="stylesheet" href="common.css">
<style>
  /* 基础变量与导航栏样式已移至根目录 common.css */

  /* 公告栏 */
  .notice-card {
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(249, 115, 22, 0.05);
    overflow: hidden;
  }

  .notice-card .notice-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    background: var(--primary-light);
    border-bottom: 1px solid #fed7aa;
    font-size: 17px;
    font-weight: bold;
    color: var(--primary-dark);
  }

  .notice-card .notice-body {
    padding: 10px 20px 14px;
  }

  .notice-card .notice-body p {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 10px 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    border-bottom: 1px dashed #fed7aa;
  }

  .notice-card .notice-body p:last-child {
    border-bottom: none;
  }

  .notice-card .notice-body p .date {
    flex-shrink: 0;
    font-size: 13px;
    color: var(--text-light);
  }

  /* 欢迎区：大标题 + 开放天数副标题 */
  .hero {
    text-align: center;
    margin-bottom: 28px;
  }

  .hero h1 {
    font-size: 32px;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }

  .hero .od-sub {
    font-size: 16px;
    color: var(--text-light);
  }

  .hero .od-num {
    display: inline-block;
    min-width: 1.6em;
    margin: 0 4px;
    font-size: 22px;
    font-weight: bold;
    color: var(--primary);
    vertical-align: -2px;
    font-variant-numeric: tabular-nums;
  }

  /* 快捷跳转栏 */
  .quick-links {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 18px;
  }

  .quick-links a {
    flex: 1;
    min-width: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 10px;
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(249, 115, 22, 0.05);
    color: var(--primary-dark);
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }

  .quick-links a:hover {
    background: var(--primary-light);
    border-color: var(--primary);
    transform: translateY(-2px);
  }

  .quick-links a.current {
    background: var(--primary);
    border-color: var(--primary-dark);
    color: var(--white);
  }

  .quick-links a.current:hover { background: var(--primary-dark); }
</style>
</head>
<body>

<!-- 导航栏（公共组件：nav.js，样式在 common.css） -->
<div id="siteNav"></div>
<script src="nav.js" data-root=""></script>

<!-- 主体 -->
<main class="main">

  <!-- 欢迎标题 -->
  <section class="hero">
    <h1>欢迎来到励洋辅助站</h1>
    <p class="od-sub">励洋辅助站已经建立<span class="od-num" id="odNum">0</span>天！</p>
  </section>

  <!-- 公告栏 -->
  <section class="notice-card">
    <div class="notice-header">公告版</div>
    <div class="notice-body" id="noticeBody">
      <p><span>公告加载中…</span></p>
    </div>
  </section>

  <!-- 快捷跳转栏：对应导航栏「站内导航」的五个页面 -->
  <nav class="quick-links" aria-label="快捷跳转">
    <a href="/" class="current">首页</a>
    <a href="/lesson">课程</a>
    <a href="/problem">题目</a>
    <a href="/user/">查询励洋用户</a>
    <a href="/status/">查询提交记录</a>
  </nav>

</main>

<script>
  // 开放天数：从开站日期起算（跨天自动 +1），打开页面时数字快速滚动到目标值
  (function () {
    var START_DATE = new Date("2026-11-06T00:00:00");  // 开站日期，改这里即可
    var now = new Date();
    var days = Math.floor((now - START_DATE) / 86400000) + 1;  // 开站当天算第 1 天
    if (days < 1) days = 1;

    var el = document.getElementById("odNum");
    var DURATION = 1500;  // 滚动动画时长（毫秒）

    function animate(from, to) {
      var start = null;
      function step(ts) {
        if (!start) start = ts;
        var p = Math.min((ts - start) / DURATION, 1);
        // easeOutCubic：先快后慢
        var eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(from + (to - from) * eased);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    animate(0, days);
  })();

  // 公告：从数据库读取，改库即生效，无需重新部署
  (function () {
    var box = document.getElementById("noticeBody");
    fetch("/api/announcements")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var items = d.items || [];
        if (!items.length) {
          box.innerHTML = "<p><span>暂无公告</span></p>";
          return;
        }
        var html = "";
        items.forEach(function (a) {
          html += "<p><span>" + a.content + "</span><span class=\"date\">" + a.date + "</span></p>";
        });
        box.innerHTML = html;
      })
      .catch(function () {
        box.innerHTML = "<p><span>公告加载失败，请刷新重试</span></p>";
      });
  })();
</script>
</body>
</html>
