<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程 - 励洋辅助站</title>
<link rel="stylesheet" href="/common.css">
<link rel="stylesheet" href="/lesson/style.css">
<script src="/vendor/marked.min.js"></script>
<script src="/md.js"></script>
<style>
  /* 基础变量与导航栏样式已移至根目录 common.css */

  .page-title {
    font-size: 24px;
    color: var(--primary-dark);
    margin-bottom: 20px;
  }

  /* 搜索框 */
  .search-box {
    display: flex;
    margin-bottom: 16px;
  }

  .search-box input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #fed7aa;
    border-right: none;
    border-radius: 4px 0 0 4px;
    background: var(--white);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box input:focus { border-color: var(--primary); }

  .search-box .search-label {
    display: flex;
    align-items: center;
    padding: 0 16px;
    border: 1px solid #fed7aa;
    border-radius: 0 4px 4px 0;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 13px;
    white-space: nowrap;
  }

  /* 无匹配提示 */
  .no-result {
    display: none;
    padding: 24px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-light);
  }

  /* 课程列表 */
  .lesson-list {
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(249, 115, 22, 0.05);
    overflow: hidden;
  }

  .lesson-list a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid #ffedd5;
    transition: background 0.15s;
  }

  .lesson-list a:last-child { border-bottom: none; }

  .lesson-list a:hover { background: var(--primary-light); }

  .lesson-list .lid {
    flex-shrink: 0;
    font-weight: bold;
    color: var(--primary-dark);
    font-size: 15px;
  }

  .lesson-list .linfo { flex: 1; min-width: 0; }

  .lesson-list .lname {
    font-size: 15px;
    font-weight: bold;
  }

  .lesson-list .lname:hover { color: var(--primary-dark); }

  /* 状态标签：updating=更新中，done=已完结 */
  .lesson-list .status {
    flex-shrink: 0;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 3px;
    background: #dbeafe;
    color: #1d4ed8;
  }

  .lesson-list .status.done {
    background: #dcfce7;
    color: #15803d;
  }

  /* 详情加载失败 */
  .detail-error {
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    padding: 32px;
    text-align: center;
    color: var(--text-light);
    font-size: 15px;
  }

  .detail-error a { color: var(--primary-dark); text-decoration: none; }
  .detail-error a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- 导航栏（公共组件：nav.js，样式在 common.css） -->
<div id="siteNav"></div>
<script src="/nav.js"></script>

<!-- 列表视图：无 ?id 时显示 -->
<main class="main" id="listView">
  <h1 class="page-title">课程列表</h1>

  <!-- 搜索：输入即过滤，无需回车 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入课程名搜索，如：第一课 或 C++" oninput="filterLessons()" autocomplete="off">
    <span class="search-label">搜索课程</span>
  </div>

  <!-- 课程列表由 /api/lessons 渲染 -->
  <div class="lesson-list" id="lessonList">
    <div class="no-result" id="noResult">没有匹配的课程</div>
  </div>
</main>

<!-- 详情视图：lesson.html?id=1 时显示，内容由 /api/lesson 填充 -->
<main class="main" id="detailView" hidden>
  <div class="lesson-card" id="lessonCard">
    <h1><span class="lid" id="dLid"></span><span class="lname" id="dLname"></span></h1>

    <div class="lesson-meta" id="dMeta" hidden>
      <span id="dStatus"></span>
    </div>

    <section id="secContent" hidden>
      <h2>课程内容</h2>
      <div id="dContent" class="md-body"></div>
    </section>

    <section id="secFiles" hidden>
      <h2>课堂讲义</h2>
      <div id="dFiles"></div>
    </section>

    <a class="back" href="/lesson">← 返回课程列表</a>
  </div>

  <div class="detail-error" id="detailError" hidden>
    <p id="detailErrorText">课程不存在</p>
    <p style="margin-top:12px"><a href="/lesson">← 返回课程列表</a></p>
  </div>
</main>

<script>
  // ===== 列表：从接口加载 =====
  function loadLessons() {
    fetch("/api/lessons")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var items = data.items || [];
        var html = "";
        items.forEach(function (l) {
          var done = l.status && l.status.indexOf("完结") !== -1;
          html += '<a href="/lesson/' + encodeURIComponent(l.id) + '">'
            + '<span class="lid">' + l.title + '</span>'
            + '<span class="linfo"><span class="lname">' + l.name + '</span></span>'
            + (l.status ? '<span class="status ' + (done ? "done" : "") + '">' + l.status + '</span>' : '')
            + '</a>';
        });
        document.getElementById("lessonList").insertAdjacentHTML("afterbegin", html);
      })
      .catch(function () {
        document.getElementById("noResult").textContent = "课程加载失败，请刷新重试";
        document.getElementById("noResult").style.display = "block";
      });
  }

  // 匹配前归一化：全部小写 + 去除空格与制表符（仅用于搜索比较，不影响页面显示）
  function norm(s) {
    return s.toLowerCase().replace(/[\s\t]/g, "");
  }

  // 每输入一个字符即时过滤：仅匹配课时名与课程名（归一化后半匹配）
  function filterLessons() {
    var q = norm(document.getElementById("searchInput").value);
    var rows = document.querySelectorAll("#lessonList a");
    var visible = 0;
    rows.forEach(function (row) {
      var lid = norm(row.querySelector(".lid").textContent);
      var name = norm(row.querySelector(".lname").textContent);
      var match = q === "" || lid.indexOf(q) !== -1 || name.indexOf(q) !== -1;
      row.style.display = match ? "" : "none";
      if (match) visible++;
    });
    document.getElementById("noResult").style.display = visible === 0 ? "block" : "none";
  }

  // 按 Enter：课时名或课程名归一化后完全匹配时跳转到该课，否则无效
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var q = norm(this.value);
    if (!q) return;
    var rows = document.querySelectorAll("#lessonList a");
    for (var i = 0; i < rows.length; i++) {
      var lid = norm(rows[i].querySelector(".lid").textContent);
      var name = norm(rows[i].querySelector(".lname").textContent);
      if (lid === q || name === q) {
        window.location.href = rows[i].getAttribute("href");
        return;
      }
    }
  });
</script>

<script>
  // ===== 详情：/lesson/1（洛谷式地址），兼容旧写法 lesson.html?id=1 =====
  var m = window.location.pathname.match(/\/lesson\/([^\/?#]+)/);
  var LID = m ? decodeURIComponent(m[1]).replace(/\.html$/i, "")
              : new URLSearchParams(window.location.search).get("id");

  function showError(msg) {
    document.getElementById("lessonCard").hidden = true;
    document.getElementById("detailError").hidden = false;
    document.getElementById("detailErrorText").textContent = msg;
  }

  function renderDetail(l) {
    document.title = l.title + " " + l.name + " - 励洋辅助站";

    document.getElementById("dLid").textContent = l.title;
    document.getElementById("dLname").textContent = l.name;

    if (l.status) {
      document.getElementById("dStatus").textContent = "状态：" + l.status;
      document.getElementById("dMeta").hidden = false;
    }

    // 课程正文（Markdown，数据库里没填就不显示这一节）
    if (l.content && l.content.trim()) {
      document.getElementById("dContent").innerHTML = renderMD(l.content);
      document.getElementById("secContent").hidden = false;
    }

    if (l.files && l.files.length) {
      var box = document.getElementById("dFiles");
      l.files.forEach(function (f) {
        box.insertAdjacentHTML("beforeend",
          '<a class="handout-btn" href="' + f.url + '" download="' + f.label + '">' + f.label + '</a>'
          + (f.tip ? '<p class="handout-tip">' + f.tip + '</p>' : ''));
      });
      document.getElementById("secFiles").hidden = false;
    }
  }

  if (LID) {
    document.getElementById("listView").hidden = true;
    document.getElementById("detailView").hidden = false;

    fetch("/api/lesson?id=" + encodeURIComponent(LID))
      .then(function (r) {
        if (r.status === 404) throw new Error("课程不存在");
        return r.json();
      })
      .then(renderDetail)
      .catch(function (err) {
        showError(err.message || "课程加载失败，请刷新重试");
      });
  } else {
    loadLessons();
  }
</script>

</body>
</html>
