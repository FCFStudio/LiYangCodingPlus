<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问题 - 励洋辅助站</title>
<link rel="icon" href="/favicon/favicon.ico">
<link rel="stylesheet" href="/common.css">
<link rel="stylesheet" href="/problem/style.css">
<script src="/vendor/marked.min.js"></script>
<script src="/md.js"></script>
<style>
  /* 基础变量与导航栏样式已移至根目录 common.css */

  .page-title {
    font-size: 24px;
    color: var(--primary-dark);
    margin-bottom: 20px;
  }

  /* 搜索框 */
  .search-box {
    display: flex;
    margin-bottom: 16px;
  }

  .search-box input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #fed7aa;
    border-right: none;
    border-radius: 4px 0 0 4px;
    background: var(--white);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box input:focus { border-color: var(--primary); }

  /* 搜索范围多选下拉 */
  .search-box .ms {
    position: relative;
    display: flex;
  }

  .search-box .ms-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    border: 1px solid #fed7aa;
    border-radius: 0 4px 4px 0;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 13px;
    font-family: inherit;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s;
  }

  .search-box .ms-btn:hover { background: #ffe8d3; }

  .search-box .ms-btn .caret {
    font-size: 10px;
    transition: transform 0.2s;
  }

  .search-box .ms.open .ms-btn .caret { transform: rotate(180deg); }

  .ms-panel {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 50;
    min-width: 200px;
    padding: 6px;
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(249, 115, 22, 0.12);
  }

  .ms-panel[hidden] { display: none; }

  .ms-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }

  .ms-item:hover { background: var(--primary-light); }

  .ms-item input[type="checkbox"] {
    width: 14px;
    height: 14px;
    margin: 0;
    accent-color: var(--primary);
    cursor: pointer;
  }

  /* 无匹配提示 */
  .no-result {
    display: none;
    padding: 24px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-light);
  }

  /* 题目列表卡片 */
  .problem-list {
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(249, 115, 22, 0.05);
    overflow: hidden;
  }

  .problem-list a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid #ffedd5;
    transition: background 0.15s;
  }

  .problem-list a:last-child { border-bottom: none; }

  .problem-list a:hover { background: var(--primary-light); }

  .problem-list .pid {
    flex-shrink: 0;
    font-weight: bold;
    color: var(--primary-dark);
    font-size: 15px;
  }

  .problem-list .pname {
    flex: 1;
    font-size: 15px;
  }

  .problem-list .pname:hover { color: var(--primary-dark); }

  .problem-list .ptag {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    border: 1px solid #fed7aa;
    border-radius: 3px;
    background: #fffdf9;
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: normal;
    vertical-align: 1px;
  }

  /* 详情加载失败 */
  .detail-error {
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    padding: 32px;
    text-align: center;
    color: var(--text-light);
    font-size: 15px;
  }

  .detail-error a { color: var(--primary-dark); text-decoration: none; }
  .detail-error a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- 导航栏（公共组件：nav.js，样式在 common.css） -->
<div id="siteNav"></div>
<script src="/nav.js"></script>

<!-- 列表视图：无 ?id 时显示 -->
<main class="main" id="listView">
  <h1 class="page-title">题目列表</h1>

  <!-- 关键字搜索：输入即过滤；右侧多选下拉控制过滤与回车匹配的范围 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入题号 / 题名 / 标签搜索，Enter 直接跳转" oninput="filterProblems()" autocomplete="off">
    <div class="ms" id="ms">
      <button type="button" class="ms-btn" id="msBtn" aria-haspopup="true" aria-expanded="false">
        <span id="msBtnText">搜索范围</span>
        <span class="caret">▼</span>
      </button>
      <div class="ms-panel" id="msPanel" hidden>
        <label class="ms-item"><input type="checkbox" data-opt="pidLive" checked> 题号自动过滤</label>
        <label class="ms-item"><input type="checkbox" data-opt="pidEnter" checked> 题号回车完全匹配</label>
        <label class="ms-item"><input type="checkbox" data-opt="tagLive" checked> 标签自动过滤</label>
        <label class="ms-item"><input type="checkbox" data-opt="nameLive" checked> 题目自动过滤</label>
        <label class="ms-item"><input type="checkbox" data-opt="nameEnter" checked> 题目回车完全匹配</label>
      </div>
    </div>
  </div>

  <div class="problem-list" id="problemList">
    <!-- 题目列表由 /api/problems 渲染 -->
    <div class="no-result" id="noResult">没有匹配的题目</div>
  </div>
</main> 

<!-- 详情视图：problem.html?id=1000 时显示，内容由 /api/problem 填充 -->
<main class="main" id="detailView" hidden>
  <div class="submit-notice">
    本题仅为示例页面，实际提交请前往 <a id="ojLink" href="https://www.liyangoj.com/" target="_blank" rel="noopener">励洋OJ</a>。
  </div>

  <div class="problem-card" id="problemCard">
    <h1><span class="pid" id="dPid"></span><span class="pname" id="dPname"></span></h1>

    <div class="problem-tags" id="dTagWrap" hidden>
      <span class="tags-label">标签：</span>
      <!-- 标签由接口填充 -->
    </div>

    <section id="secDesc">
      <h2>题目描述</h2>
      <div id="dDesc" class="md-body"></div>
    </section>

    <section id="secInput">
      <h2>输入格式</h2>
      <div id="dInput" class="md-body"></div>
    </section>

    <section id="secOutput">
      <h2>输出格式</h2>
      <div id="dOutput" class="md-body"></div>
    </section>

    <section id="secHint" hidden>
      <h2>提示</h2>
      <div id="dHint" class="md-body"></div>
    </section>

    <section id="secSample" hidden>
      <h2>样例</h2>
      <div class="sample" id="dSamples"></div>
    </section>

    <section id="secSolution" hidden>
      <h2>题解</h2>
      <button class="solution-btn" onclick="toggleSolution()">显示题解</button>
      <div class="solution-box" id="solutionBox">
        <div class="code-row">
          <div class="code-area">
            <pre class="gutter" id="solutionGutter"></pre>
            <pre id="solutionCode"></pre>
          </div>
          <button class="copy-btn" onclick="copyCode(this)">复制</button>
        </div>
      </div>
    </section>

    <a class="back" href="/problem">← 返回题目列表</a>
  </div>

  <div class="detail-error" id="detailError" hidden>
    <p id="detailErrorText">题目不存在</p>
    <p style="margin-top:12px"><a href="/problem">← 返回题目列表</a></p>
  </div>
</main>

<!-- 题解源码容器：由接口填充纯文本，highlight.js 负责高亮与行号 -->
<script type="text/plain" id="solutionSource"></script>
<script src="/problem/highlight.js"></script>

<script>
  // ===== 题解交互 =====
  function toggleSolution() {
    var box = document.getElementById("solutionBox");
    var btn = document.querySelector(".solution-btn");
    var open = box.classList.toggle("show");
    btn.textContent = open ? "隐藏题解" : "显示题解";
  }

  // 复制按钮：取同容器内 pre 的纯文本（高亮标签自动忽略）
  function copyCode(btn) {
    var pre = btn.parentElement.querySelector("pre:not(.gutter)");
    var text = pre.innerText;
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "已复制 ✓";
      setTimeout(function () { btn.textContent = old; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    }
  }
</script>

<script>
  // ===== 列表：从接口加载 =====
  var ALL_PROBLEMS = [];

  function loadProblems() {
    fetch("/api/problems")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        ALL_PROBLEMS = data.items || [];
        var html = "";
        ALL_PROBLEMS.forEach(function (p) {
          var tags = (p.tags || []).map(function (t) {
            return ' <span class="ptag">' + t + '</span>';
          }).join("");
          html += '<a href="/problem/' + encodeURIComponent(p.id) + '">'
            + '<span class="pid">' + p.id + '</span>'
            + '<span class="pname">' + p.name + tags + '</span>'
            + '</a>';
        });
        document.getElementById("problemList").insertAdjacentHTML("afterbegin", html);
      })
      .catch(function () {
        document.getElementById("noResult").textContent = "题目加载失败，请刷新重试";
        document.getElementById("noResult").style.display = "block";
      });
  }

  // 匹配前归一化：全部小写 + 去除空格与制表符（仅用于搜索比较，不影响页面显示）
  function norm(s) {
    return s.toLowerCase().replace(/[\s\t]/g, "");
  }

  // 题名文本（.pname 内含标签 span，这里只取纯文字，避免标签文字干扰题名匹配）
  function pnameText(row) {
    var nodes = row.querySelector(".pname").childNodes;
    var s = "";
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].nodeType === 3) s += nodes[i].nodeValue;
    }
    return norm(s);
  }

  // 该行所有标签拼成一个可搜索字符串
  function ptagText(row) {
    var tags = row.querySelectorAll(".ptag");
    var s = "";
    for (var i = 0; i < tags.length; i++) s += " " + tags[i].textContent;
    return norm(s);
  }

  // ===== 搜索范围选项（默认全选） =====
  var OPT = { pidLive: true, pidEnter: true, tagLive: true, nameLive: true, nameEnter: true };

  // 按钮文案：全选时显示「搜索范围」，否则显示已选数量
  function updateMsBtn() {
    var keys = Object.keys(OPT);
    var on = keys.filter(function (k) { return OPT[k]; }).length;
    document.getElementById("msBtnText").textContent =
      on === keys.length ? "搜索范围" : "已选 " + on + "/" + keys.length;
  }

  (function initMs() {
    var wrap = document.getElementById("ms");
    var btn = document.getElementById("msBtn");
    var panel = document.getElementById("msPanel");

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var willOpen = panel.hidden;
      panel.hidden = !willOpen;
      wrap.classList.toggle("open", willOpen);
      btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
    });

    // 点击面板外部关闭
    document.addEventListener("click", function (e) {
      if (!wrap.contains(e.target)) {
        panel.hidden = true;
        wrap.classList.remove("open");
        btn.setAttribute("aria-expanded", "false");
      }
    });

    // 勾选变化：更新状态并立即重新过滤
    panel.addEventListener("change", function (e) {
      var box = e.target;
      if (box.type !== "checkbox") return;
      OPT[box.dataset.opt] = box.checked;
      updateMsBtn();
      filterProblems();
    });
  })();

  // 每输入一个字符即时过滤：按已开启的项（题号 / 题名 / 标签）做归一化包含匹配
  function filterProblems() {
    var q = norm(document.getElementById("searchInput").value);
    var anyLive = OPT.pidLive || OPT.nameLive || OPT.tagLive;
    var rows = document.querySelectorAll("#problemList a");
    var visible = 0;
    rows.forEach(function (row) {
      var match = q === "" || !anyLive;
      if (!match && OPT.pidLive && norm(row.querySelector(".pid").textContent).indexOf(q) !== -1) match = true;
      if (!match && OPT.nameLive && pnameText(row).indexOf(q) !== -1) match = true;
      if (!match && OPT.tagLive && ptagText(row).indexOf(q) !== -1) match = true;
      row.style.display = match ? "" : "none";
      if (match) visible++;
    });
    document.getElementById("noResult").style.display = visible === 0 ? "block" : "none";
  }

  // 按 Enter：按已开启的项做完全匹配，命中即跳转（先题号，后题名）
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var q = norm(this.value);
    if (!q) return;
    var rows = document.querySelectorAll("#problemList a");
    for (var i = 0; i < rows.length; i++) {
      var pidHit = OPT.pidEnter && norm(rows[i].querySelector(".pid").textContent) === q;
      var nameHit = OPT.nameEnter && pnameText(rows[i]) === q;
      if (pidHit || nameHit) {
        window.location.href = rows[i].getAttribute("href");
        return;
      }
    }
  });
</script>

<script>
  // ===== 详情：/problem/1000（洛谷式地址），兼容旧写法 problem.html?id=1000 =====
  var m = window.location.pathname.match(/\/problem\/([^\/?#]+)/);
  var PID = m ? decodeURIComponent(m[1]).replace(/\.html$/i, "")
              : new URLSearchParams(window.location.search).get("id");

  function showError(msg) {
    document.getElementById("problemCard").hidden = true;
    document.getElementById("detailError").hidden = false;
    document.getElementById("detailErrorText").textContent = msg;
  }

  function renderDetail(p) {
    document.title = "P" + p.id + " - " + p.name + " - 励洋辅助站";

    document.getElementById("dPid").textContent = p.id;
    document.getElementById("dPname").textContent = p.name;

    if (p.tags && p.tags.length) {
      var wrap = document.getElementById("dTagWrap");
      p.tags.forEach(function (t) {
        wrap.insertAdjacentHTML("beforeend", '<span class="tag-item">' + t + '</span>');
      });
      wrap.hidden = false;
    }

    document.getElementById("dDesc").innerHTML = renderMD(p.description);
    document.getElementById("dInput").innerHTML = renderMD(p.inputFormat);
    document.getElementById("dOutput").innerHTML = renderMD(p.outputFormat);

    if (p.hint) {
      document.getElementById("dHint").innerHTML = renderMD(p.hint);
      document.getElementById("secHint").hidden = false;
    }

    if (p.samples && p.samples.length) {
      var box = document.getElementById("dSamples");
      p.samples.forEach(function (s) {
        box.insertAdjacentHTML("beforeend",
          '<div class="io"><h3>输入样例</h3>'
          + '<div class="code-row"><pre>' + s.input + '</pre>'
          + '<button class="copy-btn" onclick="copyCode(this)">复制</button></div></div>'
          + '<div class="io"><h3>输出样例</h3>'
          + '<div class="code-row"><pre>' + s.output + '</pre>'
          + '<button class="copy-btn" onclick="copyCode(this)">复制</button></div></div>');
      });
      document.getElementById("secSample").hidden = false;
    }

    if (p.solution) {
      // 统一换行符，避免源码里的 CRLF 影响行号与复制
      document.getElementById("solutionSource").textContent = p.solution.replace(/\r\n?/g, "\n");
      renderSolution();
      document.getElementById("secSolution").hidden = false;
    }

    // 提交链接带上题号（示例题 0000 不带）
    if (p.id !== "0000") {
      document.getElementById("ojLink").href = "https://www.liyangoj.com/problem.php?id=" + encodeURIComponent(p.id);
    }
  }

  if (PID) {
    document.getElementById("listView").hidden = true;
    document.getElementById("detailView").hidden = false;

    fetch("/api/problem?id=" + encodeURIComponent(PID))
      .then(function (r) {
        if (r.status === 404) throw new Error("题目不存在");
        return r.json();
      })
      .then(renderDetail)
      .catch(function (err) {
        showError(err.message || "题目加载失败，请刷新重试");
      });
  } else {
    loadProblems();
  }
</script>

</body>
</html>
