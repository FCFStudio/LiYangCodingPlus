<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题目 - 励洋辅助站</title>
<link rel="stylesheet" href="/common.css">
<link rel="stylesheet" href="/problem/style.css">
<style>
  /* 基础变量与导航栏样式已移至根目录 common.css */

  .page-title {
    font-size: 24px;
    color: var(--primary-dark);
    margin-bottom: 20px;
  }

  /* 搜索框 */
  .search-box {
    display: flex;
    margin-bottom: 16px;
  }

  .search-box input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #fed7aa;
    border-right: none;
    border-radius: 4px 0 0 4px;
    background: var(--white);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box input:focus { border-color: var(--primary); }

  .search-box .search-label {
    display: flex;
    align-items: center;
    padding: 0 16px;
    border: 1px solid #fed7aa;
    border-radius: 0 4px 4px 0;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 13px;
    white-space: nowrap;
  }

  /* 无匹配提示 */
  .no-result {
    display: none;
    padding: 24px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-light);
  }

  /* 题目列表卡片 */
  .problem-list {
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(249, 115, 22, 0.05);
    overflow: hidden;
  }

  .problem-list a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid #ffedd5;
    transition: background 0.15s;
  }

  .problem-list a:last-child { border-bottom: none; }

  .problem-list a:hover { background: var(--primary-light); }

  .problem-list .pid {
    flex-shrink: 0;
    font-weight: bold;
    color: var(--primary-dark);
    font-size: 15px;
  }

  .problem-list .pname {
    flex: 1;
    font-size: 15px;
  }

  .problem-list .pname:hover { color: var(--primary-dark); }

  .problem-list .ptag {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    border: 1px solid #fed7aa;
    border-radius: 3px;
    background: #fffdf9;
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: normal;
    vertical-align: 1px;
  }

  /* 详情加载失败 */
  .detail-error {
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    padding: 32px;
    text-align: center;
    color: var(--text-light);
    font-size: 15px;
  }

  .detail-error a { color: var(--primary-dark); text-decoration: none; }
  .detail-error a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- 导航栏（公共组件：nav.js，样式在 common.css） -->
<div id="siteNav"></div>
<script src="/nav.js"></script>

<!-- 列表视图：无 ?id 时显示 -->
<main class="main" id="listView">
  <h1 class="page-title">题目列表</h1>

  <!-- 按题号搜索：输入即过滤，无需回车 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入题号搜索，Enter直接跳转" oninput="filterProblems()" autocomplete="off">
    <span class="search-label">按题号搜索</span>
  </div>

  <div class="problem-list" id="problemList">
    <!-- 题目列表由 /api/problems 渲染 -->
    <div class="no-result" id="noResult">没有匹配的题目</div>
  </div>
</main>

<!-- 详情视图：problem.html?id=1000 时显示，内容由 /api/problem 填充 -->
<main class="main" id="detailView" hidden>
  <div class="submit-notice">
    本题仅为示例页面，实际提交请前往 <a id="ojLink" href="https://www.liyangoj.com/" target="_blank" rel="noopener">励洋OJ</a>。
  </div>

  <div class="problem-card" id="problemCard">
    <h1><span class="pid" id="dPid"></span><span class="pname" id="dPname"></span></h1>

    <div class="problem-meta">
      <span id="dTime" hidden></span>
      <span id="dMemory" hidden></span>
    </div>

    <div class="problem-tags" id="dTagWrap" hidden>
      <span class="tags-label">标签：</span>
      <!-- 标签由接口填充 -->
    </div>

    <section id="secDesc">
      <h2>题目描述</h2>
      <div id="dDesc"></div>
    </section>

    <section id="secInput">
      <h2>输入格式</h2>
      <div id="dInput"></div>
    </section>

    <section id="secOutput">
      <h2>输出格式</h2>
      <div id="dOutput"></div>
    </section>

    <section id="secHint" hidden>
      <h2>提示</h2>
      <div id="dHint"></div>
    </section>

    <section id="secSample" hidden>
      <h2>样例</h2>
      <div class="sample" id="dSamples"></div>
    </section>

    <section id="secSolution" hidden>
      <h2>题解</h2>
      <button class="solution-btn" onclick="toggleSolution()">显示题解</button>
      <div class="solution-box" id="solutionBox">
        <div class="code-row">
          <div class="code-area">
            <pre class="gutter" id="solutionGutter"></pre>
            <pre id="solutionCode"></pre>
          </div>
          <button class="copy-btn" onclick="copyCode(this)">复制</button>
        </div>
      </div>
    </section>

    <a class="back" href="/problem">← 返回题目列表</a>
  </div>

  <div class="detail-error" id="detailError" hidden>
    <p id="detailErrorText">题目不存在</p>
    <p style="margin-top:12px"><a href="/problem">← 返回题目列表</a></p>
  </div>
</main>

<!-- 题解源码容器：由接口填充纯文本，highlight.js 负责高亮与行号 -->
<script type="text/plain" id="solutionSource"></script>
<script src="/problem/highlight.js"></script>

<script>
  // ===== 题解交互 =====
  function toggleSolution() {
    var box = document.getElementById("solutionBox");
    var btn = document.querySelector(".solution-btn");
    var open = box.classList.toggle("show");
    btn.textContent = open ? "隐藏题解" : "显示题解";
  }

  // 复制按钮：取同容器内 pre 的纯文本（高亮标签自动忽略）
  function copyCode(btn) {
    var pre = btn.parentElement.querySelector("pre:not(.gutter)");
    var text = pre.innerText;
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "已复制 ✓";
      setTimeout(function () { btn.textContent = old; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    }
  }
</script>

<script>
  // ===== 列表：从接口加载 =====
  var ALL_PROBLEMS = [];

  function loadProblems() {
    fetch("/api/problems")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        ALL_PROBLEMS = data.items || [];
        var html = "";
        ALL_PROBLEMS.forEach(function (p) {
          var tags = (p.tags || []).map(function (t) {
            return ' <span class="ptag">' + t + '</span>';
          }).join("");
          html += '<a href="/problem/' + encodeURIComponent(p.id) + '">'
            + '<span class="pid">' + p.id + '</span>'
            + '<span class="pname">' + p.name + tags + '</span>'
            + '</a>';
        });
        document.getElementById("problemList").insertAdjacentHTML("afterbegin", html);
      })
      .catch(function () {
        document.getElementById("noResult").textContent = "题目加载失败，请刷新重试";
        document.getElementById("noResult").style.display = "block";
      });
  }

  // 匹配前归一化：全部小写 + 去除空格与制表符（仅用于搜索比较，不影响页面显示）
  function norm(s) {
    return s.toLowerCase().replace(/[\s\t]/g, "");
  }

  // 每输入一个字符即时过滤：题号归一化后包含关键字即显示
  function filterProblems() {
    var q = norm(document.getElementById("searchInput").value);
    var rows = document.querySelectorAll("#problemList a");
    var visible = 0;
    rows.forEach(function (row) {
      var pid = norm(row.querySelector(".pid").textContent);
      var match = q === "" || pid.indexOf(q) !== -1;
      row.style.display = match ? "" : "none";
      if (match) visible++;
    });
    document.getElementById("noResult").style.display = visible === 0 ? "block" : "none";
  }

  // 按 Enter：题号归一化后完全匹配时跳转到该题，否则无效
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var q = norm(this.value);
    if (!q) return;
    var rows = document.querySelectorAll("#problemList a");
    for (var i = 0; i < rows.length; i++) {
      var pid = norm(rows[i].querySelector(".pid").textContent);
      if (pid === q) {
        window.location.href = rows[i].getAttribute("href");
        return;
      }
    }
  });
</script>

<script>
  // ===== 详情：/problem/1000（洛谷式地址），兼容旧写法 problem.html?id=1000 =====
  var m = window.location.pathname.match(/\/problem\/([^\/?#]+)/);
  var PID = m ? decodeURIComponent(m[1]).replace(/\.html$/i, "")
              : new URLSearchParams(window.location.search).get("id");

  function showError(msg) {
    document.getElementById("problemCard").hidden = true;
    document.getElementById("detailError").hidden = false;
    document.getElementById("detailErrorText").textContent = msg;
  }

  function renderDetail(p) {
    document.title = p.id + " " + p.name + " - 励洋辅助站";

    document.getElementById("dPid").textContent = p.id;
    document.getElementById("dPname").textContent = p.name;

    if (p.timeLimit) {
      document.getElementById("dTime").textContent = "时间限制：" + p.timeLimit;
      document.getElementById("dTime").hidden = false;
    }
    if (p.memoryLimit) {
      document.getElementById("dMemory").textContent = "内存限制：" + p.memoryLimit;
      document.getElementById("dMemory").hidden = false;
    }

    if (p.tags && p.tags.length) {
      var wrap = document.getElementById("dTagWrap");
      p.tags.forEach(function (t) {
        wrap.insertAdjacentHTML("beforeend", '<span class="tag-item">' + t + '</span>');
      });
      wrap.hidden = false;
    }

    document.getElementById("dDesc").innerHTML = p.description || "";
    document.getElementById("dInput").innerHTML = p.inputFormat || "";
    document.getElementById("dOutput").innerHTML = p.outputFormat || "";

    if (p.hint) {
      document.getElementById("dHint").innerHTML = p.hint;
      document.getElementById("secHint").hidden = false;
    }

    if (p.samples && p.samples.length) {
      var box = document.getElementById("dSamples");
      p.samples.forEach(function (s) {
        box.insertAdjacentHTML("beforeend",
          '<div class="io"><h3>输入样例</h3>'
          + '<div class="code-row"><pre>' + s.input + '</pre>'
          + '<button class="copy-btn" onclick="copyCode(this)">复制</button></div></div>'
          + '<div class="io"><h3>输出样例</h3>'
          + '<div class="code-row"><pre>' + s.output + '</pre>'
          + '<button class="copy-btn" onclick="copyCode(this)">复制</button></div></div>');
      });
      document.getElementById("secSample").hidden = false;
    }

    if (p.solution) {
      // 统一换行符，避免源码里的 CRLF 影响行号与复制
      document.getElementById("solutionSource").textContent = p.solution.replace(/\r\n?/g, "\n");
      renderSolution();
      document.getElementById("secSolution").hidden = false;
    }

    // 提交链接带上题号（示例题 0000 不带）
    if (p.id !== "0000") {
      document.getElementById("ojLink").href = "https://www.liyangoj.com/problem.php?id=" + encodeURIComponent(p.id);
    }
  }

  if (PID) {
    document.getElementById("listView").hidden = true;
    document.getElementById("detailView").hidden = false;

    fetch("/api/problem?id=" + encodeURIComponent(PID))
      .then(function (r) {
        if (r.status === 404) throw new Error("题目不存在");
        return r.json();
      })
      .then(renderDetail)
      .catch(function (err) {
        showError(err.message || "题目加载失败，请刷新重试");
      });
  } else {
    loadProblems();
  }
</script>

</body>
</html>
