<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查询励洋用户 - 励洋辅助站</title>
<link rel="icon" href="/favicon/favicon.ico">
<link rel="stylesheet" href="/common.css">
<style>
  .user-main {
    min-height: calc(100vh - 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .user-card {
    width: 100%;
    max-width: 460px;
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(249, 115, 22, 0.08);
    padding: 36px 32px;
    text-align: center;
  }
  .user-card h1 {
    font-size: 22px;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }
  .user-card .sub {
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 24px;
  }
  #userName {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #fdba74;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  #userName:focus { border-color: var(--primary); }
  #goBtn {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    background: var(--primary);
    color: var(--white);
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #goBtn:hover { background: var(--primary-dark); }
  .err-tip {
    display: none;
    margin-top: 12px;
    color: #dc2626;
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="siteNav"></div>
<script src="/nav.js"></script>

<main class="user-main">
  <div class="user-card">
    <h1>查询励洋用户</h1>
    <p class="sub">输入对方的励洋编程用户名，直达其个人主页</p>
    <input id="userName" type="text" autocomplete="off"
           placeholder="请确保您的励洋OJ处于登录状态">
    <button id="goBtn" onclick="go()">查 询</button>
    <p class="err-tip" id="errTip">请先输入用户名</p>
  </div>
</main>

<script>
  function go() {
    var input = document.getElementById("userName");
    var name = input.value.trim();
    if (!name) {
      document.getElementById("errTip").style.display = "block";
      input.focus();
      return;
    }
    document.getElementById("errTip").style.display = "none";
    window.location.href = "https://www.liyangoj.com/userinfo.php?user=" + encodeURIComponent(name);
  }

  document.getElementById("userName").addEventListener("keydown", function (e) {
    if (e.key === "Enter") go();
  });

  // 开始输入时隐藏错误提示
  document.getElementById("userName").addEventListener("input", function () {
    document.getElementById("errTip").style.display = "none";
  });
</script>
</body>
</html>
