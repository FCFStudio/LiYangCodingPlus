<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>502 网关错误 - 励洋辅助站</title>
<link rel="icon" href="/favicon/favicon.ico">
<link rel="stylesheet" href="/common.css">
<style>
  .err-main {
    min-height: calc(100vh - 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .err-card {
    width: 100%;
    max-width: 480px;
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(249, 115, 22, 0.08);
    padding: 44px 32px;
    text-align: center;
  }
  .err-code { font-size: 64px; font-weight: bold; color: var(--primary); line-height: 1; }
  .err-card h1 { font-size: 20px; color: var(--primary-dark); margin: 14px 0 8px; }
  .err-card p { color: var(--text-light); font-size: 14px; margin-bottom: 24px; }
  .err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .err-actions a {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    border: 1px solid #fdba74;
    color: var(--primary-dark);
    background: var(--white);
    transition: background 0.15s, border-color 0.15s;
  }
  .err-actions a:hover { background: var(--primary-light); border-color: var(--primary); }
  .err-actions a.primary { background: var(--primary); border-color: var(--primary); color: var(--white); }
  .err-actions a.primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
</style>
</head>
<body>
<div id="siteNav"></div>
<script src="/nav.js"></script>

<main class="err-main">
  <div class="err-card">
    <div class="err-code">502</div>
    <h1>网关开小差了</h1>
    <p>网站的上游服务暂时不可用，请稍后再试。</p>
    <div class="err-actions">
      <a class="primary" href="javascript:location.reload()">刷新重试</a>
      <a href="/">返回首页</a>
    </div>
  </div>
</main>
</body>
</html>
