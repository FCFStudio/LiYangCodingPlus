<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题目列表 - 励洋辅助站</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 基础变量与导航栏样式已移至根目录 common.css */

  .page-title {
    font-size: 24px;
    color: var(--primary-dark);
    margin-bottom: 20px;
  }

  /* 搜索框 */
  .search-box {
    display: flex;
    margin-bottom: 16px;
  }

  .search-box input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #fed7aa;
    border-right: none;
    border-radius: 4px 0 0 4px;
    background: var(--white);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box input:focus { border-color: var(--primary); }

  .search-box .search-label {
    display: flex;
    align-items: center;
    padding: 0 16px;
    border: 1px solid #fed7aa;
    border-radius: 0 4px 4px 0;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 13px;
    white-space: nowrap;
  }

  /* 无匹配提示 */
  .no-result {
    display: none;
    padding: 24px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-light);
  }

  /* 题目列表卡片 */
  .problem-list {
    background: var(--white);
    border: 1px solid #fed7aa;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(249, 115, 22, 0.05);
    overflow: hidden;
  }

  .problem-list a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid #ffedd5;
    transition: background 0.15s;
  }

  .problem-list a:last-child { border-bottom: none; }

  .problem-list a:hover { background: var(--primary-light); }

  .problem-list .pid {
    flex-shrink: 0;
    font-weight: bold;
    color: var(--primary-dark);
    font-size: 15px;
  }

  .problem-list .pname {
    flex: 1;
    font-size: 15px;
  }

  .problem-list .pname:hover { color: var(--primary-dark); }

  .problem-list .ptag {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    border: 1px solid #fed7aa;
    border-radius: 3px;
    background: #fffdf9;
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: normal;
    vertical-align: 1px;
  }
</style>
</head>
<body>

<!-- 导航栏（公共组件：nav.js，样式在 common.css） -->
<div id="siteNav"></div>
<script src="nav.js" data-root=""></script>

<!-- 主体 -->
<main class="main">
  <h1 class="page-title">题目列表</h1>

  <!-- 按题号搜索：输入即过滤，无需回车 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入题号搜索，Enter直接跳转" oninput="filterProblems()" autocomplete="off">
    <span class="search-label">按题号搜索</span>
  </div>

  <div class="problem-list" id="problemList">
    <!-- 题目列表由 problem/manifest.js 自动渲染；新增题目后运行根目录 update-manifests.ps1 更新 -->
    <div class="no-result" id="noResult">没有匹配的题目</div>
  </div>
</main>

<script src="problem/manifest.js"></script>
<script>
  // 自动渲染题目列表（数据来自 manifest.js，不影响下方搜索功能）
  (function () {
    var list = window.PROBLEM_MANIFEST || [];
    var html = "";
    list.forEach(function (p) {
      var tags = (p.tags || []).map(function (t) {
        return ' <span class="ptag">' + t + '</span>';
      }).join("");
      html += '<a href="problem/' + p.file + '">'
        + '<span class="pid">' + p.pid + '</span>'
        + '<span class="pname">' + p.name + tags + '</span>'
        + '</a>';
    });
    document.getElementById("problemList").insertAdjacentHTML("afterbegin", html);
  })();
</script>

<script>
  // 匹配前归一化：全部小写 + 去除空格与制表符（仅用于搜索比较，不影响页面显示）
  function norm(s) {
    return s.toLowerCase().replace(/[\s\t]/g, "");
  }

  // 每输入一个字符即时过滤：题号归一化后包含关键字即显示
  function filterProblems() {
    var q = norm(document.getElementById("searchInput").value);
    var rows = document.querySelectorAll("#problemList a");
    var visible = 0;
    rows.forEach(function (row) {
      var pid = norm(row.querySelector(".pid").textContent);
      var match = q === "" || pid.indexOf(q) !== -1;
      row.style.display = match ? "" : "none";
      if (match) visible++;
    });
    document.getElementById("noResult").style.display = visible === 0 ? "block" : "none";
  }

  // 按 Enter：题号归一化后完全匹配时跳转到该题，否则无效
  (function () {
    var input = document.getElementById("searchInput");
    input.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      var q = norm(input.value);
      if (!q) return;
      var rows = document.querySelectorAll("#problemList a");
      for (var i = 0; i < rows.length; i++) {
        var pid = norm(rows[i].querySelector(".pid").textContent);
        if (pid === q) {
          window.location.href = rows[i].getAttribute("href");
          return;
        }
      }
    });
  })();
</script>

</body>
</html>
